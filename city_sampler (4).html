<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>city sampler</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0a; --surface: #111; --border: #222; --border-hi: #333;
    --text: #bbb; --text-dim: #444; --text-hi: #eee;
    --green: #4dffb4; --green-dim: rgba(77,255,180,0.08);
    --red: #ff5555; --amber: #f5a623;
    --mono: 'Share Tech Mono', monospace;
    --cond: 'Barlow Condensed', sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400&display=swap');
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 12px; }
  body { display: flex; flex-direction: column; padding: 20px 24px; gap: 0; min-height: 100vh; }

  h1 { font-family: var(--cond); font-size: 20px; font-weight: 300; letter-spacing: .25em; text-transform: uppercase; color: var(--text-hi); }
  .header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .city-now { font-size: 11px; color: var(--text-dim); letter-spacing: .08em; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .status { font-size: 10px; letter-spacing: .05em; margin-bottom: 14px; min-height: 13px; color: var(--text-dim); }
  .status.ok  { color: var(--green); }
  .status.err { color: var(--red); }
  .status.wrn { color: var(--amber); }

  .search-row { display: flex; gap: 6px; margin-bottom: 8px; }
  input[type=text] { flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text-hi); font-family: var(--mono); font-size: 13px; padding: 7px 10px; outline: none; }
  input[type=text]:focus { border-color: var(--border-hi); }
  input[type=text]::placeholder { color: var(--text-dim); }

  .station-list { margin-bottom: 14px; display: none; flex-direction: column; gap: 2px; max-height: 130px; overflow-y: auto; }
  .station-list.visible { display: flex; }
  .station-item { background: var(--surface); border: 1px solid var(--border); padding: 5px 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; transition: border-color .1s; }
  .station-item:hover { border-color: var(--border-hi); color: var(--text-hi); }
  .station-item.playing { border-color: var(--green); color: var(--green); }
  .sname { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .stag  { font-size: 9px; color: var(--text-dim); flex-shrink: 0; }

  button { background: transparent; border: 1px solid var(--border-hi); color: var(--text); font-family: var(--mono); font-size: 11px; padding: 7px 13px; cursor: pointer; letter-spacing: .04em; transition: all .1s; white-space: nowrap; }
  button:hover { background: var(--surface); color: var(--text-hi); border-color: #444; }
  button:active { transform: scale(.98); }
  button.lit { border-color: var(--green); color: var(--green); }

  .clock-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding: 8px 10px; border: 1px solid var(--border); background: var(--surface); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; transition: background .04s; }
  .dot.beat { background: var(--green); }
  .bpm-group { display: flex; align-items: center; gap: 8px; flex: 1; }
  .lbl { font-size: 10px; color: var(--text-dim); letter-spacing: .08em; flex-shrink: 0; }

  input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; flex: 1; min-width: 50px; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--border-hi); border-radius: 1px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; background: #555; border-radius: 50%; margin-top: -4.5px; }
  input[type=range]:hover::-webkit-slider-thumb { background: var(--green); }
  .val { font-size: 11px; color: var(--text-hi); min-width: 32px; text-align: right; flex-shrink: 0; }

  .sec-title { font-size: 9px; letter-spacing: .15em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }
  .sdiv-wrap { margin-bottom: 14px; }
  .sdiv-grid { display: flex; gap: 4px; flex-wrap: wrap; }
  .sdiv { font-family: var(--mono); font-size: 10px; padding: 4px 7px; border: 1px solid var(--border); color: var(--text-dim); cursor: pointer; }
  .sdiv:hover { color: var(--text); border-color: var(--border-hi); }
  .sdiv.sel { border-color: var(--green); color: var(--green); background: var(--green-dim); }

  .layers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .layer { border: 1px solid var(--border); background: var(--surface); padding: 10px 12px; }
  .layer-hdr { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .layer-id { font-family: var(--cond); font-size: 18px; font-weight: 300; letter-spacing: .1em; color: var(--text-hi); }
  .layer-type { font-size: 9px; color: var(--text-dim); letter-spacing: .1em; text-transform: uppercase; }
  .param { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .param:last-of-type { margin-bottom: 0; }
  .plbl { font-size: 10px; color: var(--text-dim); min-width: 48px; }
  .meter { height: 2px; background: var(--border); margin-top: 8px; overflow: hidden; }
  .mfill { height: 100%; width: 0%; background: var(--green); }

  .grain-sec { border: 1px solid var(--border); background: var(--surface); padding: 10px 12px; margin-bottom: 14px; }

  .foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); font-size: 10px; color: var(--text-dim); letter-spacing: .04em; line-height: 1.9; }
  audio { display: none; }
</style>
</head>
<body>
<audio id="aud" crossorigin="anonymous" preload="none"></audio>

<div class="header">
  <h1>city sampler</h1>
  <span class="city-now" id="cityNow">—</span>
</div>

<div class="status" id="status">escribe una ciudad y pulsa buscar</div>

<div class="search-row">
  <input type="text" id="cityInput" placeholder="madrid, berlin, tokyo..." value="madrid" autocomplete="off"
    onkeydown="if(event.key==='Enter') doSearch()"/>
  <button onclick="doSearch()">buscar</button>
</div>

<div class="station-list" id="stationList"></div>

<div class="clock-row">
  <span class="dot" id="dot"></span>
  <button id="startBtn" onclick="toggleClock()">start</button>
  <div class="bpm-group">
    <span class="lbl">BPM</span>
    <input type="range" id="bpmR" min="40" max="240" value="120" step="1" oninput="setBPM(+this.value)"/>
    <span class="val" id="bpmV">120</span>
  </div>
  <span style="font-size:10px;color:var(--text-dim)">MIDI auto</span>
</div>

<div class="sdiv-wrap">
  <div class="sec-title">subdivisión</div>
  <div class="sdiv-grid" id="sdivGrid"></div>
</div>

<div class="layers">
  <div class="layer">
    <div class="layer-hdr"><span class="layer-id">A</span><span class="layer-type">chunk</span></div>
    <div class="param">
      <span class="plbl">nivel</span>
      <input type="range" id="volA" min="0" max="1" step="0.01" value="0.8" oninput="setGain('A',+this.value)"/>
      <span class="val" id="volAv">80%</span>
    </div>
    <div class="param">
      <span class="plbl">pitch</span>
      <input type="range" id="pitchA" min="-12" max="12" step="1" value="0" oninput="document.getElementById('pitchAv').textContent=this.value+'st'"/>
      <span class="val" id="pitchAv">0st</span>
    </div>
    <div class="meter"><div class="mfill" id="mA"></div></div>
  </div>
  <div class="layer">
    <div class="layer-hdr"><span class="layer-id">B</span><span class="layer-type">granular</span></div>
    <div class="param">
      <span class="plbl">nivel</span>
      <input type="range" id="volB" min="0" max="1" step="0.01" value="0.65" oninput="setGain('B',+this.value)"/>
      <span class="val" id="volBv">65%</span>
    </div>
    <div class="param">
      <span class="plbl">densidad</span>
      <input type="range" id="dens" min="1" max="16" step="1" value="4" oninput="document.getElementById('densV').textContent=this.value"/>
      <span class="val" id="densV">4</span>
    </div>
    <div class="meter"><div class="mfill" id="mB"></div></div>
  </div>
</div>

<div class="grain-sec">
  <div class="sec-title">granular</div>
  <div class="param">
    <span class="plbl">grain</span>
    <input type="range" id="gsz" min="20" max="800" step="10" value="150" oninput="document.getElementById('gszV').textContent=this.value+'ms'"/>
    <span class="val" id="gszV">150ms</span>
  </div>
  <div class="param">
    <span class="plbl">scatter</span>
    <input type="range" id="scat" min="0" max="1" step="0.01" value="0.3" oninput="document.getElementById('scatV').textContent=Math.round(this.value*100)+'%'"/>
    <span class="val" id="scatV">30%</span>
  </div>
  <div class="param" style="margin-bottom:0">
    <span class="plbl">posición</span>
    <input type="range" id="gpos" min="0" max="1" step="0.01" value="0.5" oninput="document.getElementById('gposV').textContent=Math.round(this.value*100)+'%'"/>
    <span class="val" id="gposV">50%</span>
  </div>
</div>

<div class="foot">
  Buffer: ~10s acumulado · MIDI clock: detecta automáticamente · A y B comparten fuente, salidas independientes
</div>

<script>
const SDIVS=[
  {l:'1/1',b:4},{l:'1/2',b:2},{l:'1/2t',b:4/3},
  {l:'1/4',b:1},{l:'1/4t',b:2/3},{l:'1/8',b:.5},
  {l:'1/8t',b:1/3},{l:'1/16',b:.25},{l:'1/16t',b:1/6},
  {l:'1/32',b:.125},{l:'1/64',b:.0625}
];

// mapa ciudad → countrycode ISO
const CC={
  madrid:'ES',barcelona:'ES',sevilla:'ES',valencia:'ES',bilbao:'ES',
  'san sebastian':'ES',zaragoza:'ES',málaga:'ES',malaga:'ES',
  paris:'FR',lyon:'FR',marseille:'FR',bordeaux:'FR',toulouse:'FR',
  berlin:'DE',munich:'DE',hamburg:'DE','cologne':'DE','köln':'DE',frankfurt:'DE',
  london:'GB',manchester:'GB',glasgow:'GB',bristol:'GB',edinburgh:'GB',
  rome:'IT',milan:'IT',milano:'IT',napoli:'IT',naples:'IT',florence:'IT',
  tokyo:'JP',osaka:'JP',kyoto:'JP',
  'new york':'US','los angeles':'US',chicago:'US',miami:'US',seattle:'US',portland:'US',
  amsterdam:'NL',rotterdam:'NL','the hague':'NL',
  lisbon:'PT',porto:'PT',lisboa:'PT',
  brussels:'BE',bruxelles:'BE',
  vienna:'AT',wien:'AT',graz:'AT',
  zurich:'CH',geneva:'CH','zürich':'CH',
  stockholm:'SE',gothenburg:'SE',oslo:'NO',copenhagen:'DK',helsinki:'FI',
  warsaw:'PL',krakow:'PL',prague:'CZ',budapest:'HU',bucharest:'RO',
  athens:'GR',istanbul:'TR',
  moscow:'RU','saint petersburg':'RU',
  beijing:'CN',shanghai:'CN',
  sydney:'AU',melbourne:'AU',brisbane:'AU',
  'buenos aires':'AR',bogota:'CO',lima:'PE',santiago:'CL',
  'mexico city':'MX',guadalajara:'MX',monterrey:'MX',
  quito:'EC',guayaquil:'EC',
  cairo:'EG',johannesburg:'ZA',nairobi:'KE',lagos:'NG',
  mumbai:'IN',delhi:'IN',bangalore:'IN',
  seoul:'KR',bangkok:'TH',singapore:'SG',
  toronto:'CA',montreal:'CA',vancouver:'CA',
};

let selSd=3, bpm=120, clockOn=false, clockTmr=null;
let ctx, gA, gB, anA, anB, buf=[], SR=44100, proc=null, srcNode=null;
let midiTicks=0, midiActive=false;
let stations=[], currentStation=-1;

/* grid */
function buildGrid(){
  const g=document.getElementById('sdivGrid');
  SDIVS.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='sdiv'+(i===selSd?' sel':'');
    b.textContent=s.l;
    b.onclick=()=>{selSd=i;document.querySelectorAll('.sdiv').forEach((x,j)=>x.classList.toggle('sel',j===i));};
    g.appendChild(b);
  });
}

function sdivMs(){ return (60000/bpm)*SDIVS[selSd].b; }
function setBPM(v){ bpm=v; document.getElementById('bpmV').textContent=v; }

/* clock */
function toggleClock(){
  if(!ctx) initAudio();
  clockOn=!clockOn;
  const btn=document.getElementById('startBtn');
  btn.textContent=clockOn?'stop':'start';
  btn.classList.toggle('lit',clockOn);
  if(clockOn) sched(); else { clearTimeout(clockTmr); clockTmr=null; }
}
function sched(){ if(!clockOn||midiActive) return; tick(); clockTmr=setTimeout(sched,sdivMs()); }
function tick(){ flash(); if(buf.length>SR*0.4){ trigA(); trigB(); } }
function flash(){ const d=document.getElementById('dot'); d.classList.add('beat'); setTimeout(()=>d.classList.remove('beat'),80); }

/* audio */
function initAudio(){
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  SR=ctx.sampleRate;
  gA=ctx.createGain(); gA.gain.value=0.8;
  gB=ctx.createGain(); gB.gain.value=0.65;
  anA=ctx.createAnalyser(); anA.fftSize=256;
  anB=ctx.createAnalyser(); anB.fftSize=256;
  gA.connect(anA); anA.connect(ctx.destination);
  gB.connect(anB); anB.connect(ctx.destination);
  meters(); setupMIDI();
}

function setGain(layer,v){
  const pct=Math.round(v*100)+'%';
  if(layer==='A'){ if(gA) gA.gain.value=v; document.getElementById('volAv').textContent=pct; }
  else           { if(gB) gB.gain.value=v; document.getElementById('volBv').textContent=pct; }
}

/* search */
async function doSearch(){
  const raw=document.getElementById('cityInput').value.trim();
  if(!raw) return;
  if(!ctx) initAudio();
  setStatus('buscando: '+raw+'...','');
  buf=[]; stations=[]; currentStation=-1;
  const list=document.getElementById('stationList');
  list.classList.remove('visible'); list.innerHTML='';

  const city=raw.toLowerCase();
  const cc=CC[city]||null;
  let found=[];

  // intentos en orden de especificidad
  const queries=[
    // por nombre de estación
    `https://de1.api.radio-browser.info/json/stations/search?name=${encodeURIComponent(raw)}&limit=30&hidebroken=true&order=votes&reverse=true`,
    // por state/región
    `https://de1.api.radio-browser.info/json/stations/search?state=${encodeURIComponent(raw)}&limit=30&hidebroken=true&order=votes&reverse=true`,
  ];
  if(cc){
    // por país — las más votadas
    queries.push(`https://de1.api.radio-browser.info/json/stations/search?countrycode=${cc}&limit=60&hidebroken=true&order=votes&reverse=true`);
  }
  // fallback global top
  queries.push(`https://de1.api.radio-browser.info/json/stations/topvote/30`);

  for(const url of queries){
    try{
      const r=await fetch(url,{headers:{'User-Agent':'CitySampler/1.0'}});
      if(!r.ok) continue;
      const data=await r.json();
      if(!Array.isArray(data)||!data.length) continue;
      // filtrar streams usables: necesitan url_resolved, no HLS
      const clean=data.filter(s=>
        s.url_resolved &&
        s.url_resolved.startsWith('http') &&
        !s.url_resolved.includes('.m3u8') &&
        (s.codec==='MP3'||s.codec==='AAC'||s.codec===''||!s.codec)
      );
      if(clean.length){ found=clean.slice(0,8); break; }
    } catch(e){ console.warn('fetch error',e); }
  }

  if(!found.length){ setStatus('sin resultados. verifica tu conexión.','err'); return; }

  stations=found;
  renderList();
  playStation(0);
}

function renderList(){
  const list=document.getElementById('stationList');
  list.innerHTML='';
  stations.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='station-item'+(i===currentStation?' playing':'');
    d.innerHTML=`<span class="sname">${s.name}</span><span class="stag">${s.codec||''} ${s.bitrate?s.bitrate+'k':''}</span>`;
    d.onclick=()=>playStation(i);
    list.appendChild(d);
  });
  list.classList.add('visible');
}

function playStation(idx){
  if(!stations[idx]) return;
  currentStation=idx;
  document.querySelectorAll('.station-item').forEach((el,i)=>el.classList.toggle('playing',i===idx));
  buf=[];
  const s=stations[idx];
  const url=s.url_resolved||s.url;
  setStatus('conectando: '+s.name+'...','');
  document.getElementById('cityNow').textContent=s.name;

  const aud=document.getElementById('aud');
  if(srcNode){ try{ srcNode.disconnect(); }catch(e){} srcNode=null; }
  if(proc){ try{ proc.disconnect(); }catch(e){} proc=null; }

  if(ctx && ctx.state==='suspended') ctx.resume();

  aud.src=url; aud.load();

  aud.oncanplay=()=>{
    const p=aud.play();
    if(p){
      p.then(()=>hookAudio(aud,s.name)).catch(()=>{
        setStatus('click ▶ para iniciar (politica del navegador)','wrn');
        showPlayBtn(aud, s.name);
      });
    } else {
      hookAudio(aud,s.name);
    }
  };
  aud.onerror=()=>setStatus('stream roto — prueba otra','err');
}

function showPlayBtn(aud, name){
  const existing=document.getElementById('manualPlayBtn');
  if(existing) existing.remove();
  const btn=document.createElement('button');
  btn.id='manualPlayBtn';
  btn.textContent='▶ iniciar audio';
  btn.style.cssText='margin-bottom:10px;border-color:#f5a623;color:#f5a623;';
  btn.onclick=()=>{
    if(ctx && ctx.state==='suspended') ctx.resume();
    aud.play().then(()=>{ hookAudio(aud,name); btn.remove(); })
      .catch(()=>setStatus('no se pudo iniciar — prueba otra estacion','err'));
  };
  document.getElementById('stationList').insertAdjacentElement('afterend', btn);
}

function hookAudio(aud,name){
  if(ctx.state==='suspended') ctx.resume();
  srcNode=ctx.createMediaElementSource(aud);

  proc=ctx.createScriptProcessor(4096,2,1);
  srcNode.connect(proc);
  const sink=ctx.createGain(); sink.gain.value=0;
  proc.connect(sink); sink.connect(ctx.destination);

  proc.onaudioprocess=e=>{
    const ch=e.inputBuffer.getChannelData(0);
    buf.push(...ch);
    if(buf.length>SR*10) buf=buf.slice(buf.length-SR*10);
  };

  setStatus('▶ '+name,'ok');
}

/* layer A */
function trigA(){
  const pitch=+document.getElementById('pitchA').value;
  const samples=Math.max(512,Math.floor(sdivMs()/1000*SR));
  if(buf.length<samples) return;
  const slice=new Float32Array(samples);
  slice.set(buf.slice(buf.length-samples));
  const ab=ctx.createBuffer(1,samples,SR);
  ab.getChannelData(0).set(slice);
  const src=ctx.createBufferSource();
  src.buffer=ab;
  src.playbackRate.value=Math.pow(2,pitch/12);
  const dur=samples/SR;
  const env=ctx.createGain();
  const atk=Math.min(0.005,dur*.05);
  const rel=Math.min(0.01,dur*.05);
  env.gain.setValueAtTime(0,ctx.currentTime);
  env.gain.linearRampToValueAtTime(1,ctx.currentTime+atk);
  env.gain.setValueAtTime(1,ctx.currentTime+dur-rel);
  env.gain.linearRampToValueAtTime(0,ctx.currentTime+dur);
  src.connect(env); env.connect(gA);
  src.start(); src.stop(ctx.currentTime+dur+.1);
}

/* layer B */
function trigB(){
  if(buf.length<SR*.3) return;
  const density=+document.getElementById('dens').value;
  const grainMs=+document.getElementById('gsz').value;
  const scatter=+document.getElementById('scat').value;
  const pos=+document.getElementById('gpos').value;
  const gSamples=Math.floor(grainMs/1000*SR);
  const intervalMs=sdivMs()/density;
  const bufLen=buf.length;
  for(let i=0;i<density;i++){
    const jMs=(Math.random()-.5)*scatter*intervalMs;
    const when=ctx.currentTime+Math.max(0,i*intervalMs+jMs)/1000;
    const center=Math.floor(pos*(bufLen-gSamples));
    const spread=Math.floor(Math.random()*SR*.4);
    const start=Math.max(0,Math.min(bufLen-gSamples,center+(Math.random()>.5?1:-1)*spread));
    if(start+gSamples>bufLen) continue;
    const gb=ctx.createBuffer(1,gSamples,SR);
    gb.getChannelData(0).set(buf.slice(start,start+gSamples));
    const gs=ctx.createBufferSource(); gs.buffer=gb;
    const env=ctx.createGain();
    const half=grainMs/1000/2;
    env.gain.setValueAtTime(0,when);
    env.gain.linearRampToValueAtTime(1,when+half);
    env.gain.linearRampToValueAtTime(0,when+half*2);
    gs.connect(env); env.connect(gB);
    gs.start(when); gs.stop(when+grainMs/1000+.1);
  }
}

/* meters */
function meters(){
  const dA=new Uint8Array(anA.frequencyBinCount);
  const dB=new Uint8Array(anB.frequencyBinCount);
  (function f(){
    anA.getByteTimeDomainData(dA);
    anB.getByteTimeDomainData(dB);
    let rA=0,rB=0;
    for(let i=0;i<dA.length;i++){ rA+=(dA[i]/128-1)**2; rB+=(dB[i]/128-1)**2; }
    document.getElementById('mA').style.width=Math.min(100,Math.sqrt(rA/dA.length)*600)+'%';
    document.getElementById('mB').style.width=Math.min(100,Math.sqrt(rB/dB.length)*600)+'%';
    requestAnimationFrame(f);
  })();
}

/* MIDI */
async function setupMIDI(){
  if(!navigator.requestMIDIAccess) return;
  try{
    const ma=await navigator.requestMIDIAccess({sysex:false});
    const attach=inp=>{
      inp.onmidimessage=e=>{
        if(e.data[0]===0xF8){
          midiTicks++;
          if(midiTicks>=Math.round(24*SDIVS[selSd].b)){
            midiTicks=0; midiActive=true;
            if(!clockOn){ clockOn=true; document.getElementById('startBtn').textContent='stop'; document.getElementById('startBtn').classList.add('lit'); }
            tick();
          }
        }
        if(e.data[0]===0xFA) midiTicks=0;
        if(e.data[0]===0xFC){ midiActive=false; clockOn=false; document.getElementById('startBtn').textContent='start'; document.getElementById('startBtn').classList.remove('lit'); }
      };
    };
    ma.inputs.forEach(attach);
    ma.onstatechange=e=>{ if(e.port.type==='input') attach(e.port); };
  }catch(e){}
}

function setStatus(msg,type){
  const el=document.getElementById('status');
  el.textContent=msg; el.className='status'+(type?' '+type:'');
}

buildGrid();
</script>
</body>
